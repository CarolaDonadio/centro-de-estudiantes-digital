  <!--
    ================================================================
    SCRIPT INLINE: lógica del admin con datos demo.
    En Fase 2 → endpoints CodeIgniter 4 + tabla `auditoria` en MySQL.
    Este script es el "cerebro" del panel de administración, manejando la lógica de la interfaz y la interacción con los datos.
    ================================================================
  -->
  <script>
  const SESSION_STORAGE_KEY = 'cedSession';

  (async function () {
    'use strict';

    /* ============================================================
       1) DATOS DINÁMICOS (desde sesión y JSON)
       Esta sección se encarga de cargar la información inicial necesaria para el panel,
       como los datos del usuario logueado, usuarios, carreras, etc.
       ============================================================ */

    // Recupera la sesión del usuario actual desde el localStorage.
    // Si no hay sesión, inicializa un objeto vacío para evitar errores.
    const session = JSON.parse(localStorage.getItem('cedSession')) || {};
    const adminNombre = session.nombre || 'Administrador';
    // Genera las iniciales del usuario para el avatar.
    const adminIniciales = adminNombre.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();

    // Crea un objeto 'admin' con los datos relevantes de la sesión.
    const admin = {
      id: 4,
      nombre: adminNombre,
      iniciales: adminIniciales,
      usuario: session.usuario || '',
      rol: session.rol || 'administrador',
      loggedAt: session.loggedAt || ''
    };

    // Determina si el usuario actual tiene rol de administrador (para permisos).
    const isAdminUser = ['admin', 'administrador'].includes(admin.rol?.toLowerCase());
    window.isAdminUser = isAdminUser;

    // Cargar usuarios desde API
    let usuariosJSON = [];
    try {
      console.log('📥 Cargando usuarios desde API...');
      usuariosJSON = await Usuarios.listar();
      console.log('✅ Usuarios cargados:', usuariosJSON.length);
    } catch (err) {
      console.warn('[Admin] No se pudo cargar usuarios de la API:', err);
    }

    // Carga la lista de carreras desde la API.
    // Cargar carreras desde API
    let carreras = [];
    try {
      carreras = await Carreras.listar();
      console.log('✅ Carreras cargadas desde API:', carreras.length);
    } catch (err) {
      console.error('[Admin] Error al cargar carreras desde API:', err);
    }

    // Carga las materias desde un archivo JSON local.
    // Cargar materias desde JSON para los selectores de novedades
    let materias = [];
    try {
      const respMat = await fetch('../json/materias.json');
      const dataMat = await respMat.json();
      materias = dataMat.materias || [];
      console.log('✅ Materias cargadas:', materias.length);
    } catch (err) {
      console.warn('[Admin] No se pudo cargar materias del JSON:', err);
    }

    // --- Control de visibilidad de módulos del sidebar según el rol del usuario ---
    // Obtiene referencias a los elementos de navegación del sidebar.
    const navCarreras = document.getElementById('nav-carreras');
    const navUsuarios = document.getElementById('nav-usuarios');
    const navReglamentacion = document.getElementById('nav-reglamentacion');
    const rolLower = admin.rol.toLowerCase();

    // Si el usuario es Admin, Docente o Delegado, muestra los módulos de Carreras y Reglamentación.
    if (isAdminUser || rolLower === 'docente' || rolLower === 'delegado') {
      if (navCarreras) navCarreras.style.display = 'block';
      if (navReglamentacion) navReglamentacion.style.display = 'block';
    }

    // El módulo de Usuarios y Roles es exclusivo para Administradores.
    // Usuarios y Roles: Acceso exclusivo para Administradores
    if (isAdminUser) {
      if (navUsuarios) navUsuarios.style.display = 'block';
    }

    const PERFIL_MAP = { 1: 'alumno', 2: 'docente', 3: 'delegado', 4: 'admin' };
    const PERFIL_MAP_INVERSE = { 'alumno': 1, 'docente': 2, 'delegado': 3, 'admin': 4 };
    // Mapea los usuarios cargados de la API a un formato más usable, incluyendo el rol en texto.

    const usuarios = usuariosJSON.map(u => ({
      id: u.id,
      nombre: u.nombre,
      usuario: u.usuario,
      email: u.email,
      dni: u.dni,
      rol: PERFIL_MAP[u.perfil_id] || 'alumno',
      perfil_id: u.perfil_id,
      carrera_id: u.carrera_id,
      activo: u.activo,
      created_at: u.created_at
    }));

    // Enriquecer el objeto 'admin' con datos más completos del usuario logueado.
    // Enriquecer admin con datos de la sesión
    const adminFullData = usuarios.find(u => u.usuario === admin.usuario);
    if (adminFullData) {
      admin.email = adminFullData.email || '';
      admin.dni = adminFullData.dni || '';
      admin.carrera_id = adminFullData.carrera_id;
      // También actualiza el rol si viene de la sesión y es más específico
      admin.rol = PERFIL_MAP[adminFullData.perfil_id] || admin.rol;
    }

    // Helper: nombre de carrera por id
    // Función auxiliar para obtener el nombre de una carrera a partir de su ID.
    function getCarreraNombre(id) {
      if (!id) return 'Todas';
      const c = carreras.find(x => x.id == id);
      return c ? (c.codigo ? `${c.codigo} – ${c.nombre}` : c.nombre) : '—';
    }

    // Cargar novedades desde API y categorías desde JSON
    let novedades = [];
    let categorias = [];
    try {
      // Cargamos categorías del JSON para mantener los colores y estilos
      const respCat = await fetch('../json/novedades.json');
      const dataCat = await respCat.json();
      categorias = dataCat.categorias || [];

      // Carga las novedades reales desde la API.
      // Cargamos novedades reales de la API
        console.log('📥 Cargando novedades desde API...');
        novedades = await Novedades.listar();

        // Lógica para asegurar que la categoría "Carreras" exista si el usuario es docente.
        // Si el rol es docente, nos aseguramos de que exista una categoría "Carreras"
        if (rolLower === 'docente') {
          const hasCarrerasCat = categorias.some(c => String(c.nombre).toLowerCase() === 'carreras');
          if (!hasCarrerasCat) {
            const nextId = categorias.length ? Math.max(...categorias.map(x => x.id)) + 1 : 1;
            categorias.push({ id: nextId, nombre: 'Carreras', color: '#4A67C9' });
          }
        }

        // Asigna el nombre de la categoría a cada novedad basándose en el ID.
        // Enriquecemos con nombres de categoría mapeados
        novedades.forEach(n => {
          const cat = categorias.find(c => c.id == n.categoria_id);
          if (cat) n.categoria = cat.nombre;
        });
        console.log('✅ Novedades cargadas:', novedades.length);
    } catch (e) {
      console.error('Error al cargar datos de novedades:', e);
    }

    // Actualiza el avatar y el nombre del usuario en el encabezado del panel.
    // Actualizar header con datos del usuario logueado
    const userAvatarEl = document.getElementById('userAvatar');
    const userNameEl = document.getElementById('userName');
    if (userAvatarEl) userAvatarEl.textContent = admin.iniciales;
    if (userNameEl) userNameEl.textContent = admin.nombre;

    // Actualiza el texto del rol en la "píldora" del encabezado.
    // Actualizar el texto del rol en el header
    const rolePillEl = document.querySelector('.role-pill');
    if (rolePillEl) {
      const roleTextMap = {
        'admin': 'Administrador',
        'administrador': 'Administrador',
        'docente': 'Docente',
        'delegado': 'Delegado',
        'alumno': 'Alumno' // Aunque admin.html no es para alumno, se incluye por completitud
      };
      rolePillEl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z" stroke-linejoin="round"></path></svg> ${roleTextMap[admin.rol.toLowerCase()] || admin.rol.charAt(0).toUpperCase() + admin.rol.slice(1)}`;
    }

    /* ============================================================
       MÓDULOS DEL PROYECTO (datos desde js/admin/modulos.js y API)
       Esta sección define la estructura de los módulos del panel y cómo se cargan sus datos.
       ============================================================ */
    // Añade el módulo de Carreras a la estructura global de módulos.
    window.MODULOS_DATA['mod-carreras'] = {
      titulo: 'Carreras',
      icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></svg>', // SVG del icono
      descripcion: 'Gestión de las carreras del instituto, códigos y perfiles académicos.',
      items: [] // Se poblará con datos de la API
    };
    const modulosData = window.MODULOS_DATA || {};
    // `isAdminUser` ya está declarado más arriba y refleja si el usuario es administrador
    let eventosAdmin = [];

    // Función para cargar la reglamentación desde la API y formatearla para la UI.
    async function loadReglamentacionFromAPI() {
      if (!modulosData['mod-reglamentacion']) return;
      try {
        console.log('📥 Cargando reglamentación desde API...');
        const data = await Reglamentacion.listar();
        if (!Array.isArray(data)) return;

        modulosData['mod-reglamentacion'].items = data.map(doc => ({
          id: doc.id,
          titulo: doc.titulo,
          categoria: doc.categoria,
          version: doc.version,
          detalle: `${doc.tipo ? doc.tipo.charAt(0).toUpperCase() + doc.tipo.slice(1) : 'Doc'} · ${doc.categoria ? doc.categoria.charAt(0).toUpperCase() + doc.categoria.slice(1) : 'Normativa'} · ${doc.version || 'v1.0'} · Publicado ${doc.fecha_publicacion || '---'}`,
          estado: 'Vigente',
          estadoClase: 'activo',
          link: doc.link || (doc.archivo ? `json/${doc.archivo}` : undefined)
        }));

        modulosData['mod-reglamentacion'].descripcion = 'Repositorio centralizado de documentos oficiales con versionado y búsqueda por palabras clave. Los documentos se cargan desde la API de reglamentaciones.';
        console.log('✅ Reglamentación cargada:', modulosData['mod-reglamentacion'].items.length);
      } catch (err) {
        console.warn('No se pudo cargar reglamentación desde API:', err);
      }
    }

    // Función para cargar los eventos desde la API y formatearlos para la UI.
    async function loadEventosFromAPI() {
      if (!modulosData['mod-eventos']) return;
      try {
        console.log('📥 Cargando eventos desde API...');
        const data = await Eventos.listar();
        eventosAdmin = data.map(ev => {
          const inscriptos = ev.inscriptos || 0;
          const cupo = ev.cupo || 0;
          const id = isNaN(Number(ev.id)) ? ev.id : Number(ev.id);
          return {
            ...ev,
            id,
            detalle: `${ev.categoria || 'General'} · ${ev.lugar || 'S/D'} · Cupo ${inscriptos}/${cupo}`
          };
        });
        console.log('✅ Eventos cargados:', eventosAdmin.length);
      } catch (err) {
        console.warn('No se pudo cargar eventos desde API:', err);
        eventosAdmin = [];
      }
    }

    // --- CALENDARIO ACADÉMICO (datos y configuración) ---
    let calendarioAdmin = [];
    let calendarioMes = new Date(); // Guarda el mes actual que se está mostrando en el calendario.
    
    // Mapeo de tipos de eventos del calendario a etiquetas y colores para la UI.
    const CAL_TYPES = {
      'examen': { label: 'Examen', color: '#C0392B' },
      'inscripcion': { label: 'Inscripción', color: '#F5A623' },
      'feriado': { label: 'Feriado/Receso', color: '#8a8d9c' },
      'evento': { label: 'Evento', color: '#4A67C9' }
    };

    // Función para cargar los eventos del calendario desde la API.
    async function loadCalendarioFromAPI() {
      try {
        calendarioAdmin = await Calendario.listar();
      } catch (err) {
        console.warn('Calendario no disponible en API');
      }
    }

    // Función auxiliar para formatear fechas y horas.
    // Utils
    function formatDateTime(isoDate) {
      if (!isoDate) return '---';
      const date = new Date(isoDate);
      return date.toLocaleString('es-AR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Define las categorías de eventos que cada rol puede gestionar.
    function roleEventCategories() {
      if (isAdminUser) return ['Académico', 'Social', 'Cultural', 'Centro de Estudiantes', 'Deportivo'];
      const role = admin.rol.toLowerCase();
      if (role === 'docente') return ['Académico', 'Social', 'Cultural'];
      if (role === 'delegado') return ['Centro de Estudiantes', 'Social', 'Cultural'];
      return ['Social', 'Cultural'];
    }

    // Genera las opciones HTML para un selector de carreras.
    function carreraOptions(selectedId) {
      return `<option value="">— Todas las carreras —</option>` +

    function renderCalendarioAdmin() {
      const currentDate = calendarioMes || new Date();
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      let startingDay = firstDay.getDay();

      const eventosFiltrados = calendarioAdmin; // No hay filtro por tipo en admin por ahora

      const eventosDelMes = {};
      eventosFiltrados.forEach(e => {
        const [evYear, evMonth, evDay] = e.fecha.split('-');
        if (parseInt(evYear) === year && parseInt(evMonth) - 1 === month) {
          const d = parseInt(evDay);
          if (!eventosDelMes[d]) eventosDelMes[d] = [];
          eventosDelMes[d].push(e);
        }
      });

      let calHTML = `
        <div class="calendar-layout"><div class="calendar-layout__grid"><div class="calendar-header">
          <button class="cal-nav-btn" id="prevMonthAdmin" aria-label="Mes anterior">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h3 class="calendar-title">${meses[month]} ${year}</h3>
          <button class="cal-nav-btn" id="nextMonthAdmin" aria-label="Mes siguiente">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      `;

      calHTML += `<div class="calendar-grid"><div class="calendar-weekdays">`;
      diasSemana.forEach(d => {
        calHTML += `<div class="calendar-weekday">${d}</div>`;
      });
      calHTML += `</div><div class="calendar-days">`;

      for (let i = 0; i < startingDay; i++) {
        calHTML += `<div class="calendar-day calendar-day--empty"></div>`;
      }

      const hoy = new Date();
      const esMesActual = hoy.getFullYear() === year && hoy.getMonth() === month;

      for (let d = 1; d <= lastDay.getDate(); d++) {
        const isToday = esMesActual && hoy.getDate() === d;
        const dayEvents = eventosDelMes[d] || [];

        let dotsHTML = '<div class="calendar-day-events">';
        dayEvents.slice(0, 3).forEach(e => {
          dotsHTML += `<span class="calendar-dot" style="background-color: ${CAL_TYPES[e.tipo]?.color || '#ccc'}" title="${e.titulo}"></span>`;
        });
        if (dayEvents.length > 3) {
          dotsHTML += `<span class="calendar-dot calendar-dot--more" title="Más eventos"></span>`;
        }
        dotsHTML += '</div>';

        const dayClass = isToday ? 'calendar-day calendar-day--today' : 'calendar-day';
        const hasEventsClass = dayEvents.length > 0 ? 'calendar-day--has-events' : '';
        calHTML += `
          <div class="${dayClass} ${hasEventsClass}">
            <span class="calendar-day-num">${d}</span>
            ${dotsHTML}
          </div>
        `;
      }
      calHTML += `</div></div></div>`;

      let eventosDelMesFlat = [];
      Object.keys(eventosDelMes).sort((a, b) => parseInt(a) - parseInt(b)).forEach(dia => {
        eventosDelMes[dia].forEach(e => eventosDelMesFlat.push(e));
      });

      calHTML += `<div class="calendar-layout__list"><div class="calendar-event-list">`;
      calHTML += `<p class="drawer-section-label" style="margin-top: 0; margin-bottom: 1rem; font-size: 1.1rem; color: var(--brand-900, #1A1D4A);">Eventos de ${meses[month]}</p>`;

      if (eventosDelMesFlat.length === 0) {
        calHTML += `<div class="notif-empty" style="margin-top:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" />
            </svg>
            <p>No hay eventos registrados.</p>
          </div>`;
      } else {
        eventosDelMesFlat.forEach(e => {
          const [y, m, d] = e.fecha.split('-');
          const canEdit = isAdminUser || (admin.rol === 'docente' && e.tipo === 'examen');
          calHTML += `
            <div class="cal-list-item" style="--ev-color: ${CAL_TYPES[e.tipo]?.color || '#ccc'}">
              <div class="cal-list-date">
                <span class="cal-list-day">${d}</span>
                <span class="cal-list-month">${meses[parseInt(m) - 1]?.substring(0, 3).toUpperCase()}</span>
              </div>
              <div class="cal-list-body">
                <h4 class="cal-list-title">${e.titulo}</h4>
                <div style="display:flex; justify-content:space-between; align-items:center">
                  <span class="cal-list-type" style="color: ${CAL_TYPES[e.tipo]?.color || '#ccc'}; background-color: ${CAL_TYPES[e.tipo]?.color ? CAL_TYPES[e.tipo].color + '20' : '#ccc20'}">
                    ${CAL_TYPES[e.tipo]?.label || e.tipo}
                  </span>
                  ${canEdit ? `
                    <div style="display:flex; gap:.4rem; align-items:center">
                      <button class="btn-small" data-cal-action="edit" data-cal-id="${e.id}" style="display:inline-flex;align-items:center;gap:6px">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar
                      </button>
                      <button class="btn-small btn-small--danger" data-cal-action="delete" data-cal-id="${e.id}" style="display:inline-flex;align-items:center;gap:6px">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Eliminar
                      </button>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        });
      }
      calHTML += `</div></div></div>`;
      return `<div class="calendar-wrapper">${calHTML}</div>`;
    }

    const mainContent = document.getElementById('mainContent');

    // Función principal para cambiar la vista del panel.
    function navigateTo(key, opts = {}) {
      currentDrawer = key;
      const builder = sectionContent[key];
      if (!builder) return;

      const data = builder();
      const tituloMb = data.subtitle ? '0' : '1.2rem';
      const headerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:0 0 ${tituloMb}"><h2 style="margin:0;font:700 1.4rem/1.2 'Bricolage Grotesque',serif;color:var(--brand-900,#1A1D4A)">${data.title}</h2>${data.titleAction || ''}</div>`;
      const subtituloHTML = data.subtitle ? `<p class="modulo-descripcion" style="margin:.25rem 0 1rem">${data.subtitle}</p>` : '';
      // Inyecta el HTML generado en el contenedor principal.
      mainContent.innerHTML = `${headerHTML}${subtituloHTML}<div>${data.html}</div>`;
      
      // Hooks por sección
      if (key === 'usuarios') bindUsuariosDrawer(opts.quick);
      if (key === 'mod-carreras') bindCarrerasDrawer();
      if (key === 'mod-novedades') bindNovedadesDrawer();
      if (key === 'mod-eventos') bindEventosDrawer();
      if (key === 'mod-calendario') bindCalendarioDrawer();
      if (key === 'mod-reglamentacion') bindReglamentacionDrawer();
      if (key === 'perfil') bindPerfilSection();

      // Marca el botón activo en el sidebar.
      // Active state en el menú
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-btn--active'));
      const active = document.querySelector(`.nav-btn[data-drawer="${key}"]`);
      if (active) active.classList.add('nav-btn--active');
    }

    // Bindea los eventos y la lógica para el módulo de gestión de carreras.
    function bindCarrerasDrawer() {
      const tabs = document.querySelectorAll('.drawer__tab');
      const panes = {
        lista: document.getElementById('carrerasListPane'),
        nuevo: document.getElementById('carrerasNewPane')
      };

      tabs.forEach(t => t.addEventListener('click', () => {
        tabs.forEach(x => x.classList.toggle('is-active', x === t));

      }));

      const searchInput = document.getElementById('carrerasSearch');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const q = e.target.value.trim().toLowerCase();
          document.querySelectorAll('#carrerasTableContainer tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(q) ? '' : (row.closest('thead') ? '' : 'none');

      document.getElementById('newCarreraForm')?.addEventListener('submit', async (e) => {

        const fd = new FormData(e.target);
        const data = { nombre: fd.get('nombre'), codigo: fd.get('codigo'), descripcion: fd.get('descripcion') };
        try {
          await adminData.crearCarrera(data);
          showToast('Carrera creada', `${data.nombre} fue agregada.`);
          e.target.reset();
          refreshCarrerasTable();
          if (panes.lista) tabs[0].click();
        } catch (err) {
          showToast('Error', 'No se pudo crear la carrera', '#E67E5B');
        }
      });
    }

    // Refresca la tabla de carreras, cargando los datos desde la API.
    async function refreshCarrerasTable() {
      const containerId = 'carrerasTableContainer';
      const container = document.getElementById(containerId);
      if (!container) return;

      try {
        await renderCarrerasTable(containerId);
        // Vuelve a cargar las carreras desde la API para tener los datos más recientes.
        
        // Coherencia de diseño: aplicamos estilos refinados con iconos a los botones de la tabla
        container.querySelectorAll('button').forEach(btn => {
          btn.className = 'btn-small';
          btn.style.display = 'inline-flex';
          btn.style.alignItems = 'center';
          btn.style.gap = '6px';
          btn.style.marginRight = '8px';
          
          if (btn.hasAttribute('data-carrera-edit')) {
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar`;
          }
          if (btn.hasAttribute('data-carrera-delete')) {
            btn.classList.add('btn-small--danger');
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Eliminar`;
          }
        });

        if (isAdminUser) {
          // Si es admin, vuelve a obtener las carreras para asegurar que el array local esté actualizado.
          carreras = await adminData.obtenerCarreras();

          container.querySelectorAll('[data-carrera-edit]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const id = btn.dataset.carreraId;
              const c = carreras.find(x => String(x.id) === String(id));
              if (!c) return;
              showEditCarreraForm(c);
            });
          });
          // Lógica para eliminar una carrera.
          container.querySelectorAll('[data-carrera-delete]').forEach(btn => {
            btn.addEventListener('click', () => {
              requestDangerConfirm({
                title: '¿Eliminar carrera?',
                msg: 'Se eliminará la carrera y esto puede afectar a los usuarios asociados.',
                onConfirm: async () => {
                  try {
                    await adminData.eliminarCarrera(btn.dataset.carreraId);
                    carreras = await adminData.obtenerCarreras();
                    showToast('Eliminada', 'La carrera fue eliminada.', '#E67E5B');
                    refreshCarrerasTable();
                  } catch (e) { showToast('Error', 'No se pudo eliminar.', '#E67E5B'); }
                }
              });
            });
          });
        }
      } catch (err) { container.innerHTML = '<p>Error cargando datos de carreras.</p>'; }
    }

    // Bindea los eventos y la lógica para el módulo de gestión de eventos.
    function bindEventosDrawer() {
      const tabs = document.querySelectorAll('.drawer__tab');
      const panes = {
        lista: document.getElementById('eventListPane'),
        inscriptos: document.getElementById('eventInscriptosPane')
      };

      // Función para mostrar la pestaña correcta (Lista o Alumnos Inscriptos).
      function showTab(t) {
        tabs.forEach(x => x.classList.toggle('is-active', x.dataset.tab === t));
        Object.entries(panes).forEach(([k, p]) => { if(p) p.hidden = k !== t; });
        if (t === 'inscriptos') renderInscriptosPorEvento();
      }

      tabs.forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

      const toggleBtn = document.getElementById('toggleEventForm');
      const formWrapper = document.getElementById('eventAdminFormWrapper');
      const form = document.getElementById('newEventForm');
      const eventList = document.querySelector('.modulo-list');
      const selectEv = document.getElementById('selectEventInscriptos');

      // Bindea el selector de eventos para ver los inscriptos.
      if (selectEv) selectEv.addEventListener('change', renderInscriptosPorEvento);

      async function renderInscriptosPorEvento() {
        const list = document.getElementById('inscriptosList');
        if (!selectEv || !list) return;
        const eventId = selectEv.value;
        if (!eventId) {
          list.innerHTML = '<p style="color:#8a8d9c; padding:1.5rem; text-align:center;">Elegí un evento para ver quiénes participan.</p>';
          return;
        }

        const ev = eventosAdmin.find(e => String(e.id) === String(eventId));
        if (!ev) return;

        // Obtiene los IDs de los usuarios inscriptos.
        const inscriptosIds = ev.usuarios_inscriptos || [];
        
        if (!inscriptosIds.length) {
          list.innerHTML = '<p style="color:#8a8d9c; padding:1.5rem; text-align:center;">Todavía no hay alumnos anotados en este evento.</p>';
          return;
        }

        // Genera el HTML para la lista de usuarios inscriptos.
        list.innerHTML = inscriptosIds.map(uId => {
          const u = usuarios.find(usr => usr.id == uId);
          return `
            <div class="user-row" style="margin-bottom:.6rem; grid-template-columns: 36px 1fr;">
              <div class="user-row__avatar">${u ? u.nombre.split(' ').map(n=>n[0]).slice(0,2).join('') : '??'}</div>
              <div><p class="user-row__name">${u ? u.nombre : 'Usuario #' + uId}</p><p class="user-row__meta">${u ? u.email : ''}</p></div>
            </div>`;
        }).join('');
      }

      // Lógica para mostrar/ocultar el formulario de creación/edición de eventos.
      if (toggleBtn && formWrapper) {
        toggleBtn.addEventListener('click', () => {
          const visible = formWrapper.style.display === 'block';
          formWrapper.style.display = visible ? 'none' : 'block';
          toggleBtn.textContent = visible ? 'Publicar evento' : 'Ocultar formulario';
        });
      }

      // Maneja el envío del formulario de eventos (crear o actualizar).
      if (form) {
        form.addEventListener('submit', async e => {
          e.preventDefault();
          const data = new FormData(form);
          const editingId = form.dataset.editing || null;

          const eventoData = {
            titulo: data.get('titulo').trim(),
            descripcion: data.get('descripcion').trim(),
            fecha_inicio: data.get('fecha_inicio'),
            fecha_fin: data.get('fecha_fin'),
            cupo: Number(data.get('cupo')),
            lugar: data.get('lugar').trim(),
            categoria: data.get('categoria'),
            estado: data.get('estado'),
            autor: admin.nombre
          };

          // Si se está editando un evento existente.
          if (editingId) {
            try {
              const actualizado = await Eventos.actualizar(editingId, eventoData);
              const idx = eventosAdmin.findIndex(ev => String(ev.id) === String(editingId));
              eventosAdmin[idx] = {
                ...actualizado,
                detalle: `${actualizado.categoria} · ${actualizado.lugar} · Cupo ${actualizado.inscriptos || 0}/${actualizado.cupo}`,
                usuarios_inscriptos: actualizado.usuarios_inscriptos || []
              };
              auditar('editar', 'evento', `Evento editado: ${actualizado.titulo}`);
              showToast('Evento actualizado', `El evento "${actualizado.titulo}" fue guardado.`);
              delete form.dataset.editing;
            } catch (err) {
              console.error('Error al actualizar evento:', err);
              showToast('Error', 'No se pudo actualizar el evento', 'error');
              return;
            }
          } else {
            // Si se está creando un nuevo evento.
            try {
              const creado = await Eventos.crear({ ...eventoData, inscriptos: 0, color: '#4A67C9' });
              eventosAdmin.unshift({
                ...creado,
                detalle: `${creado.categoria} · ${creado.lugar} · Cupo 0/${creado.cupo}`
              });
              auditar('crear', 'evento', `Evento creado: ${creado.titulo}`);
              showToast('Evento creado', `El evento "${creado.titulo}" fue publicado.`);
            } catch (err) {
              console.error('Error al crear evento:', err);
              showToast('Error', 'No se pudo crear el evento', 'error');
              return;
            }
          }

          // Limpia el formulario y vuelve a renderizar la lista de eventos.
          form.reset();
          if (formWrapper) formWrapper.style.display = 'none';
          if (toggleBtn) toggleBtn.textContent = 'Publicar evento';
          navigateTo('mod-eventos');
        });
      }

      // Maneja las acciones de los botones dentro de la lista de eventos (editar, eliminar).
      if (eventList) {
        eventList.addEventListener('click', async e => {
          const action = e.target.closest('[data-event-action]');
          if (!action) return;
          const eventId = action.dataset.eventId;
          const evento = eventosAdmin.find(ev => String(ev.id) === String(eventId));
          if (!evento) return;
          const type = action.dataset.eventAction;

          // Lógica para eliminar un evento.
          if (type === 'delete') {
            requestDangerConfirm({
              title: '¿Eliminar evento?',
              msg: `Estás por eliminar el evento "<strong>${evento.titulo}</strong>". Se perderá permanentemente la lista de alumnos inscriptos.`,
              btnLabel: 'Eliminar evento',
              onConfirm: async () => {
                try {
                  await Eventos.eliminar(eventId);
                  eventosAdmin = eventosAdmin.filter(ev => String(ev.id) !== String(eventId));
                  auditar('eliminar', 'evento', `Evento eliminado: ${evento.titulo}`);
                  showToast('Evento eliminado', `Se quitó el evento ${evento.titulo}.`, '#E67E5B');
                  navigateTo('mod-eventos');
                } catch (err) {
                  console.error('Error al eliminar evento:', err);
                  showToast('Error', 'No se pudo eliminar el evento', '#E67E5B');
                }
              }
            });
          }

          // Lógica para editar un evento.
          if (type === 'edit') {
            const formWrapperEdit = document.getElementById('eventAdminFormWrapper');
            if (!formWrapperEdit) return;
            formWrapperEdit.style.display = 'block';
            if (toggleBtn) toggleBtn.textContent = 'Ocultar formulario';
            form.querySelector('[name="titulo"]').value = evento.titulo;
            form.querySelector('[name="descripcion"]').value = evento.descripcion;
            form.querySelector('[name="fecha_inicio"]').value = evento.fecha_inicio.slice(0, 16);
            form.querySelector('[name="fecha_fin"]').value = evento.fecha_fin.slice(0, 16);
            form.querySelector('[name="lugar"]').value = evento.lugar;
            form.querySelector('[name="cupo"]').value = evento.cupo;
            form.querySelector('[name="categoria"]').value = evento.categoria;
            form.querySelector('[name="estado"]').value = evento.estado;
            form.dataset.editing = String(evento.id);
          }
        });
      }
    }

    function bindUserActions() {
      // Bindea los eventos para las acciones de usuario (editar, resetear password, eliminar).
      const container = document.getElementById('userList');
      if (!container) return;

      // Toggle dropdown
      container.querySelectorAll('[data-menu-btn]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const menu = btn.closest('[data-menu]');
          document.querySelectorAll('[data-menu].is-open').forEach(m => { if (m !== menu) m.classList.remove('is-open'); });
          menu.classList.toggle('is-open');
        });
      });

      // Acciones
      container.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          const u = usuarios.find(x => String(x.id) === String(id));
          if (!u) return;
          // Cerrar dropdown
          // Cierra el menú desplegable de acciones después de seleccionar una.
          btn.closest('[data-menu]').classList.remove('is-open');

          if (action === 'edit') {
            showEditForm(u);
          }
          if (action === 'reset') {
            try {
              // Genera una contraseña temporal y la actualiza en la API.
              const tempPassword = 'Reset' + Date.now().toString().slice(-6);
              console.log('📤 PUT /usuarios/' + id + ' (reset password)');
              await Usuarios.actualizar(id, {
                nombre: u.nombre,
                usuario: u.usuario,
                email: u.email,
                dni: u.dni,
                password: tempPassword,
                perfil_id: u.perfil_id,
                carrera_id: u.carrera_id,
                activo: u.activo
              });
              showToast('Password reseteado', `${u.nombre} recibirá instrucciones para crear una nueva contraseña.`);
              auditar('editar', 'usuario', `Reset de contraseña: ${u.nombre}`);
            } catch (err) {
              console.error('❌ Error al resetear password:', err);
              showToast('Error', 'No se pudo resetear la contraseña: ' + err.message, '#E67E5B');
            }
          }
          if (action === 'delete') {
            // Muestra un modal de confirmación antes de eliminar un usuario.
            requestDangerConfirm({
              title: '¿Eliminar este usuario?',
              msg: `Vas a eliminar a <strong>${u.nombre}</strong>. Esta acción no se puede deshacer.`,
              btnLabel: 'Eliminar usuario',
              onConfirm: async () => {
                try {
                  console.log('📤 DELETE /usuarios/' + id);
                  await Usuarios.eliminar(id);
                  // Elimina el usuario del array local y actualiza la UI.
                  const idx = usuarios.findIndex(x => x.id === u.id);
                  usuarios.splice(idx, 1);
                  auditar('eliminar', 'usuario', `Eliminado: ${u.nombre}`);
                  showToast('Usuario eliminado', `${u.nombre} fue removido del sistema.`, '#E67E5B');
                  document.getElementById('userSearch').dispatchEvent(new Event('input'));
                } catch (err) {
                  console.error('❌ Error al eliminar usuario:', err);
                  showToast('Error', 'No se pudo eliminar el usuario: ' + err.message, 'error');
                }
              }
            });
          }
        });
      });
    }

    // Muestra el formulario para editar un usuario.
    function showEditForm(u) {
      const cont = document.getElementById('userList');
      const roleField = isAdminUser ? `
            <label>Rol asignado
              <select name="rol" required>
                <option value="alumno" ${u.rol === 'alumno' ? 'selected' : ''}>Alumno</option>
                <option value="docente" ${u.rol === 'docente' ? 'selected' : ''}>Docente</option>
                <option value="delegado" ${u.rol === 'delegado' ? 'selected' : ''}>Delegado</option>
                <option value="admin" ${u.rol === 'admin' ? 'selected' : ''}>Administrador</option>
              </select>
            </label>` : `<input type="hidden" name="rol" value="${u.rol}">`;

      cont.innerHTML = `
        <div style="margin-bottom:.8rem">
          <button id="editBackBtn" style="padding:.45rem .7rem;font:600 .78rem 'Manrope',sans-serif;color:var(--brand-700,#2C3E87);background:var(--brand-100,#E3E9FA);border:none;border-radius:8px;cursor:pointer">← Volver a la lista</button>

        <h3 style="margin:0 0 1rem;font:700 1rem/1.2 'Bricolage Grotesque',serif;color:var(--brand-900,#1A1D4A)">Editar: ${u.nombre}</h3>
        <form class="admin-form" id="editUserForm">
          <div class="admin-form__row">
            <label>Nombre completo
              <input type="text" name="nombre" required value="${u.nombre}">
            </label>
            <label>DNI
              <input type="text" name="dni" required value="${u.dni || ''}" pattern="[0-9]{7,8}" title="7 u 8 dígitos numéricos">
            </label>
          </div>
          <div class="admin-form__row">
            <label>Usuario
              <input type="text" name="usuario" required value="${u.usuario}" pattern="[a-z0-9]+" title="Solo minúsculas y números">
            </label>
            <label>Email
              <input type="email" name="email" required value="${u.email || ''}">
            </label>
          </div>
          <div class="admin-form__row">
            <label>Nueva contraseña <small style="font-weight:400;text-transform:none;letter-spacing:0">(dejar vacío para no cambiar)</small>
              <input type="password" name="password" placeholder="Nueva contraseña">
            </label>
            <label>Rol asignado
              <select name="rol" required>
                <option value="alumno" ${u.rol === 'alumno' ? 'selected' : ''}>Alumno</option>
                <option value="docente" ${u.rol === 'docente' ? 'selected' : ''}>Docente</option>
                <option value="delegado" ${u.rol === 'delegado' ? 'selected' : ''}>Delegado</option>
                <option value="admin" ${u.rol === 'admin' ? 'selected' : ''}>Administrador</option>
              </select>
            </label>
            ${roleField}
          </div>
          <div class="admin-form__row">
            <label>Carrera
              <select name="carrera_id">
                ${carreraOptions(u.carrera_id)}
              </select>
            </label>
          </div>
          <button type="submit" class="admin-form__submit">
            <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Guardar cambios
          </button>
        </form>
      `;
      document.getElementById('editBackBtn').addEventListener('click', () => {
        document.getElementById('userSearch').dispatchEvent(new Event('input'));
      });
      document.getElementById('editUserForm').addEventListener('submit', async e => {
        e.preventDefault();
        const data = new FormData(e.target);
        const nuevoRol = data.get('rol');
        const nuevoPassword = data.get('password');

        try {
          const datosActualizados = {
            nombre: data.get('nombre'),
            dni: data.get('dni'),
            usuario: data.get('usuario'),
            email: data.get('email'),
            perfil_id: PERFIL_MAP_INVERSE[nuevoRol],
            carrera_id: data.get('carrera_id') ? +data.get('carrera_id') : null,
            activo: u.activo
          };

          // Solo incluir password si se escribió
          // Si el campo de contraseña está vacío, no se actualiza la contraseña.
          if (nuevoPassword) {
            datosActualizados.password = nuevoPassword;
          } else {
            datosActualizados.password = u.password || 'temporal123';
          }

          console.log('📤 PUT /usuarios/' + u.id, datosActualizados);
          const usuarioActualizado = await Usuarios.actualizar(u.id, datosActualizados);
          console.log('✅ Usuario actualizado:', usuarioActualizado);
          // Actualiza el objeto de usuario local con los nuevos datos.

          // Actualizar el array
          u.nombre = usuarioActualizado.nombre;
          u.dni = usuarioActualizado.dni;
          u.usuario = usuarioActualizado.usuario;
          u.email = usuarioActualizado.email;
          u.rol = nuevoRol;
          u.perfil_id = usuarioActualizado.perfil_id;
          u.carrera_id = usuarioActualizado.carrera_id;
          u.password = usuarioActualizado.password;

          auditar('editar', 'usuario', `Editado: ${u.nombre} (${u.rol})`);
          showToast('Usuario actualizado', `Los datos de ${u.nombre} fueron guardados.`);
          // Dispara un evento de 'input' para refrescar la lista de usuarios.
          document.getElementById('userSearch').dispatchEvent(new Event('input'));
        } catch (err) {
          console.error('❌ Error al actualizar usuario:', err);
          showToast('Error', 'No se pudo actualizar el usuario: ' + err.message, '#E67E5B');
        }
      });
    }

    /* ============================================================
       FUNCIONES PARA NOVEDADES (renderNovedadesAdmin, renderNovedades, bindNovedadesDrawer, etc.)

    function renderNovedadesAdmin() {
      const materiaOptions = materias.length > 0

              Crea una nueva novedad para publicar en el sistema.
            </p>

          </div>
          <div id="newCategoriaFormContainer" hidden style="margin-bottom:1.5rem; padding:1.2rem; border:1px dashed rgba(61, 170, 106, .4); border-radius:12px; background:rgba(61, 170, 106, .02)"></div>
          <form class="admin-form" id="newNovedadForm">

    function renderNovedades() {
      const listContainer = document.getElementById('novedadesList');
      if (!listContainer) return;

      const filterCategoria = document.getElementById('filterCategoria');
      const searchInput = document.getElementById('novedadesSearch');
      const query = searchInput?.value.trim().toLowerCase() || '';
      const selectedCategoria = filterCategoria?.value || 'todos';

      let filtered = novedades.filter(n => {
        const matchesCategoria = selectedCategoria === 'todos' || n.categoria_id === +selectedCategoria;
        const matchesSearch = !query || [
          n.titulo,
          n.contenido,
          n.categoria,
          getCarreraNombre(n.carrera_id),
          n.materia
        ].some(value => String(value || '').toLowerCase().includes(query));
        return matchesCategoria && matchesSearch;
      });

      // Ordenar: destacadas primero, luego por fecha más reciente
      filtered.sort((a, b) => {
        if (a.destacada !== b.destacada) return b.destacada ? -1 : 1;
        return new Date(b.fecha || b.created_at) - new Date(a.fecha || a.created_at);
      });

      listContainer.innerHTML = filtered.length > 0 ? filtered.map(n => {
        const fecha = n.fecha ? new Date(n.fecha).toLocaleDateString('es-AR', {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        }) : '';

        // Lógica de permisos: Admin puede todo, otros solo lo propio
        const canManage = isAdminUser || (n.autor_id && String(n.autor_id) === String(admin.id));
        const actionMenu = canManage ? `
            <div class="novedad-row__menu" data-menu>
              <button class="novedad-row__menu-btn" data-menu-btn type="button" aria-label="Acciones de novedad">⋯</button>
              <div class="novedad-row__menu-dropdown">
                <button type="button" data-action="edit" data-id="${n.id}">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar
                </button>
                <button type="button" class="is-danger" data-action="delete" data-id="${n.id}">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Eliminar
                </button>
              </div>
            </div>` : '';

        return `
          <div class="novedad-row" data-novedad-id="${n.id}">
            <div class="novedad-row__info">
              <strong class="novedad-row__titulo">${n.titulo}</strong>
              <div class="novedad-row__meta">
                <span>${n.categoria || 'Sin categoría'}</span>
                <span>${fecha}</span>
                ${n.materia ? `<span>${n.materia}</span>` : ''}
                ${n.carrera_id ? `<span>Carrera: ${getCarreraNombre(n.carrera_id)}</span>` : ''}
                ${n.adjunto ? `<span>Archivo: ${n.adjunto}</span>` : `<span style="color:#6c6f80">Sin adjunto</span>`}
                ${n.destacada ? `<span class="badge" style="background:#F8E71C;color:#1A1D4A;padding:.2rem .45rem;border-radius:999px;font-size:.75rem;font-weight:700">Destacada</span>` : ''}
              </div>
              <p style="margin:.55rem 0 0;color:rgba(33,37,41,.8)">${n.contenido}</p>
            </div>
            ${actionMenu}
          </div>
        `;
      }).join('') : `<p class="drawer__empty" style="margin:1rem 0;color:rgba(33,37,41,.75)">No se encontraron novedades.</p>`;

      bindNovedadActions();
    }

    // Bindea los eventos y la lógica para el módulo de gestión de novedades.
    function bindNovedadesDrawer() {
      const tabs = document.querySelectorAll('.drawer__tab');
      const panes = {
        lista: document.getElementById('novedadesListPane'),
        nueva: document.getElementById('novedadesNewPane'),
        categorias: document.getElementById('categoriasPane')
      };
      function showTab(t) {
        tabs.forEach(x => x.classList.toggle('is-active', x.dataset.tab === t));
        Object.entries(panes).forEach(([k, p]) => p.hidden = k !== t);
      }
      tabs.forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

      // Bindea los filtros de categoría y búsqueda.
      // Lista
      const filterCategoria = document.getElementById('filterCategoria');
      const search = document.getElementById('novedadesSearch');

      if (filterCategoria) filterCategoria.addEventListener('change', renderNovedades);
      if (search) search.addEventListener('input', renderNovedades);
      renderNovedades();

      // Form nueva novedad (Submit con persistencia en API)
      // Maneja el envío del formulario para crear una nueva novedad.
      document.getElementById('newNovedadForm').addEventListener('submit', async e => {
        e.preventDefault();
        const data = new FormData(e.target);
        const adjuntoFile = document.getElementById('adjunto-file').files[0];
        
        const nueva = {
          titulo: data.get('titulo'),
          contenido: data.get('contenido'),
          categoria_id: +data.get('categoria_id'),
          carrera_id: data.get('carrera_id') ? +data.get('carrera_id') : null,
          autor_id: admin.id,
          autor: admin.nombre,
          destacada: data.has('destacada') ? 1 : 0,
          fecha: new Date().toISOString().slice(0, 19).replace('T', ' '),
          materia: data.get('materia')?.trim() || null,
          adjunto: adjuntoFile ? adjuntoFile.name : null
        };

        try {
          // Llama a la API para crear la novedad.
          const resultado = await Novedades.crear(nueva);
          const cat = categorias.find(c => c.id == resultado.categoria_id);
          resultado.categoria = cat ? cat.nombre : 'Sin categoría';
          
          novedades.unshift(resultado);
          auditar('crear', 'novedad', `Nueva: ${resultado.titulo}`);
          showToast('Novedad publicada', `${resultado.titulo} fue agregada al sistema.`);
          e.target.reset();
          document.querySelector('.file-input-text').textContent = 'Seleccionar archivo';
          showTab('lista');
          renderNovedades();
        } catch (err) {
          console.error('Error al crear novedad:', err);
          showToast('Error', 'No se pudo crear la novedad', '#E67E5B');
        }
      });

      // Maneja el cambio en el input de archivo adjunto para mostrar el nombre del archivo.
      // Handle file input change
      const fileInput = document.getElementById('adjunto-file');
      if (fileInput) {
        fileInput.addEventListener('change', e => {
          const fileText = document.querySelector('.file-input-text');
          if (e.target.files.length > 0) {
            const fileName = e.target.files[0].name;
            const fileSize = (e.target.files[0].size / 1024).toFixed(1);
            fileText.textContent = `📎 ${fileName} (${fileSize} KB)`;
          } else {
            fileText.textContent = 'Seleccionar archivo';
          }
        });
      }

      // Listener para el botón "+ Nueva categoría" en el formulario de novedades.
      // Listener para el botón "+ Nueva categoría" en el formulario de novedades
      const newCatBtn = document.getElementById('newCategoriaBtn');
      const newCatCont = document.getElementById('newCategoriaFormContainer');
      
      newCatBtn.addEventListener('click', () => {
        const isHidden = newCatCont.hidden;
        newCatCont.hidden = !isHidden;
        
        if (!newCatCont.hidden) {
          showNewCategoriaForm(newCatCont);
          newCatBtn.textContent = 'Cancelar';
          newCatBtn.style.background = '#E67E5B';
          setTimeout(() => newCatCont.querySelector('input[name="nombre"]')?.focus(), 50);
        } else {
          newCatCont.innerHTML = '';
          newCatBtn.textContent = '+ Nueva categoría';
          newCatBtn.style.background = '#3DAA6A';
        }
      });

      renderCategorias();
    }

    // Bindea los eventos para las acciones de novedad (editar, eliminar).
    function bindNovedadActions() {
      const container = document.getElementById('novedadesList');
      if (!container) return;

      // Toggle dropdown
      container.querySelectorAll('[data-menu-btn]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const menu = btn.closest('[data-menu]');
          document.querySelectorAll('[data-menu].is-open').forEach(m => { if (m !== menu) m.classList.remove('is-open'); });
          menu.classList.toggle('is-open');
        });
      });

      // Acciones
      container.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          const n = novedades.find(x => String(x.id) === String(id));
          if (!n) return;
          // Cerrar dropdown
          btn.closest('[data-menu]').classList.remove('is-open');
          // Cierra el menú desplegable de acciones.

          if (action === 'edit') {
            showEditNovedadForm(n);
          }
          if (action === 'delete') {
            requestDangerConfirm({
              title: '¿Eliminar esta novedad?',
              msg: `Vas a eliminar "<strong>${n.titulo}</strong>". Esta acción no se puede deshacer.`,
              btnLabel: 'Eliminar novedad',
              onConfirm: async () => {
                try {
                  // Llama a la API para eliminar la novedad.
                  await Novedades.eliminar(n.id);
                  const idx = novedades.findIndex(x => x.id === n.id);
                  novedades.splice(idx, 1);
                  auditar('eliminar', 'novedad', `Eliminada: ${n.titulo}`);
                  showToast('Novedad eliminada', `${n.titulo} fue removida del sistema.`, '#E67E5B');
                  document.getElementById('novedadesSearch').dispatchEvent(new Event('input'));
                } catch (err) {
                  console.error('Error al eliminar novedad:', err);
                  showToast('Error', 'No se pudo eliminar la novedad', 'error');
                }
              }
            });
          }
        });
      });
    }

    // Bindea los eventos para las acciones de categoría (editar, eliminar).
    function bindCategoriaActions() {
      const container = document.getElementById('categoriasList');
      if (!container) return;

      container.querySelectorAll('[data-menu-btn]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const menu = btn.closest('[data-menu]');
          document.querySelectorAll('[data-menu].is-open').forEach(m => { if (m !== menu) m.classList.remove('is-open'); });
          menu.classList.toggle('is-open');
        });
      });

      container.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = +btn.dataset.id;
          const action = btn.dataset.action;
          const c = categorias.find(x => x.id === id);
          if (!c) return;
          btn.closest('[data-menu]').classList.remove('is-open');

          if (action === 'edit-cat') {
            showEditCategoriaForm(c);
          }
          if (action === 'delete-cat') {
            // Muestra un modal de confirmación antes de eliminar una categoría.
            requestDangerConfirm({
              title: '¿Eliminar esta categoría?',
              msg: `Vas a eliminar "<strong>${c.nombre}</strong>". Las novedades de esta categoría no se eliminarán, pero quedarán sin categoría.`,
              btnLabel: 'Eliminar categoría',
              onConfirm: () => {
                const idx = categorias.findIndex(x => x.id === c.id);
                categorias.splice(idx, 1);
                auditar('eliminar', 'categoria', `Eliminada: ${c.nombre}`);
                showToast('Categoría eliminada', `${c.nombre} fue removida del sistema.`, '#E67E5B');
                renderCategorias();
              }
            });
          }
        });
      });
    }

    // Muestra el formulario para crear una nueva categoría.
    function showNewCategoriaForm(cont) {
      if (!cont) cont = document.getElementById('categoriasList');
      
      const isInline = cont.id === 'newCategoriaFormContainer';
      const backBtnHtml = !isInline ? `
        <div style="margin-bottom:.8rem">
          <button id="categoriaBackBtn" style="padding:.45rem .7rem;font:600 .78rem 'Manrope',sans-serif;color:var(--brand-700,#2C3E87);background:var(--brand-100,#E3E9FA);border:none;border-radius:8px;cursor:pointer">← Volver a la lista</button>
        </div>` : '';

      cont.innerHTML = `
        ${backBtnHtml}
        <h3 style="margin:0 0 1rem;font:700 1rem/1.2 'Bricolage Grotesque',serif;color:var(--brand-900,#1A1D4A)">
          ${isInline ? 'Crear nueva categoría' : 'Nueva categoría'}
        </h3>
        <form class="admin-form" id="newCategoriaForm">
          <div class="admin-form__row">
            <label>Nombre
              <input type="text" name="nombre" required placeholder="Nombre de la categoría">
            </label>
            <label>Color
              <input type="color" name="color" value="#4A67C9" style="height:38px; padding:2px">
            </label>
          </div>
          <button type="submit" class="admin-form__submit" style="background:#3DAA6A">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            Guardar categoría
          </button>
        </form>
      `;

      if (!isInline) {
        document.getElementById('categoriaBackBtn').addEventListener('click', () => renderCategorias());
      }

      document.getElementById('newCategoriaForm').addEventListener('submit', e => {
        e.preventDefault();
        const data = new FormData(e.target);
        // Genera un nuevo ID para la categoría.
        const nextId = categorias.length ? Math.max(...categorias.map(c => c.id)) + 1 : 1;
        const nueva = {
          id: nextId,
          nombre: data.get('nombre'),
          color: data.get('color')
        };
        categorias.push(nueva);
        auditar('crear', 'categoria', `Nueva: ${nueva.nombre}`);
        showToast('Categoría creada', `${nueva.nombre} fue agregada al sistema.`);
        // Si el formulario está en línea (dentro del formulario de novedades), lo oculta y actualiza los selectores.

        if (isInline) {
          const btn = document.getElementById('newCategoriaBtn');
          cont.hidden = true;
          cont.innerHTML = '';
          btn.textContent = '+ Nueva categoría';
          btn.style.background = '#3DAA6A';
          
          const catSelect = document.querySelector('#newNovedadForm select[name="categoria_id"]');
          if (catSelect) {
            catSelect.innerHTML = categorias.map(c => `<option value="${c.id}" ${c.id === nueva.id ? 'selected' : ''}>${c.nombre}</option>`).join('');
          }
          const filterCat = document.getElementById('filterCategoria');
          if (filterCat) {
            filterCat.innerHTML = `<option value="todos">Todas las categorías</option>` +
              categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
          }
        }

        renderCategorias();
      });
    }

    // Renderiza la lista de categorías.
    function renderCategorias() {
      const cont = document.getElementById('categoriasList');
      if (!cont) return;

      cont.innerHTML = categorias.length > 0 ? categorias.map(c => `
        <div class="categoria-row" data-categoria-id="${c.id}">
          <span class="categoria-row__color" style="background:${c.color}"></span>
          <div class="categoria-row__info">
            <p class="categoria-row__name">${c.nombre}</p>
            <div class="categoria-row__meta">
              <span class="categoria-row__tag">ID ${c.id}</span>
              <span class="categoria-row__tag" style="border:1px solid ${c.color};background:rgba(255,255,255,.92);color:${c.color}">${c.color}</span>
            </div>
          </div>
          <div class="novedad-row__menu" data-menu>
            <button class="novedad-row__menu-btn" data-menu-btn type="button" aria-label="Acciones de categoría">⋯</button>
            <div class="novedad-row__menu-dropdown">
              <button type="button" data-action="edit-cat" data-id="${c.id}">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar
              </button>
              <button type="button" class="is-danger" data-action="delete-cat" data-id="${c.id}">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Eliminar
              </button>
            </div>
          </div>
        </div>
      `).join('') : `<p style="margin:1rem 0;color:rgba(33,37,41,.75)">Aún no hay categorías creadas.</p>`;

      bindCategoriaActions();
    }

    // Muestra el formulario para editar una categoría.
    function showEditCategoriaForm(c) {
      const cont = document.getElementById('categoriasList');
      cont.innerHTML = `
        <div style="margin-bottom:.8rem">
          <button id="categoriaBackBtn" style="padding:.45rem .7rem;font:600 .78rem 'Manrope',sans-serif;color:var(--brand-700,#2C3E87);background:var(--brand-100,#E3E9FA);border:none;border-radius:8px;cursor:pointer">← Volver a la lista</button>
        </div>
        <h3 style="margin:0 0 1rem;font:700 1rem/1.2 'Bricolage Grotesque',serif;color:var(--brand-900,#1A1D4A)">Editar: ${c.nombre}</h3>
        <form class="admin-form" id="editCategoriaForm">
          <div class="admin-form__row">
            <label>Nombre
              <input type="text" name="nombre" required value="${c.nombre}">
            </label>
            <label>Color
              <input type="color" name="color" value="${c.color}">
            </label>
          </div>
          <button type="submit" class="admin-form__submit">
            <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Guardar cambios
          </button>
        </form>
      `;
      document.getElementById('categoriaBackBtn').addEventListener('click', () => renderCategorias());
      document.getElementById('editCategoriaForm').addEventListener('submit', e => {
        e.preventDefault();
        const data = new FormData(e.target);
        c.nombre = data.get('nombre');
        c.color = data.get('color');
        auditar('editar', 'categoria', `Editada: ${c.nombre}`);
        showToast('Categoría actualizada', `Los datos de ${c.nombre} fueron guardados.`);
        renderCategorias();
      });
    }

    // Muestra el formulario para editar una novedad.
    function showEditNovedadForm(n) {
      const cont = document.getElementById('novedadesList');
      const isDelegado = admin.rol.toLowerCase() === 'delegado';
      const materiaField = !isDelegado ? `
            <label>Materia
              <select name="materia">
                <option value="">Seleccionar materia</option>
                ${materias.map(m => `<option value="${m.nombre}" ${n.materia === m.nombre ? 'selected' : ''}>${m.nombre}</option>`).join('')}
              </select>
            </label>
          ` : '';

      cont.innerHTML = `
        <div style="margin-bottom:.8rem">
          <button id="novedadBackBtn" style="padding:.45rem .7rem;font:600 .78rem 'Manrope',sans-serif;color:var(--brand-700,#2C3E87);background:var(--brand-100,#E3E9FA);border:none;border-radius:8px;cursor:pointer">← Volver a la lista</button>
        </div>
        <h3 style="margin:0 0 1rem;font:700 1rem/1.2 'Bricolage Grotesque',serif;color:var(--brand-900,#1A1D4A)">Editar: ${n.titulo}</h3>
        <form class="admin-form" id="editNovedadForm">
          <div class="admin-form__row">
            <label>Título
              <input type="text" name="titulo" required value="${n.titulo}">
            </label>
            <label>Categoría
              <select name="categoria_id" required>
                ${categorias.map(c => `<option value="${c.id}" ${c.id == n.categoria_id ? 'selected' : ''}>${c.nombre}</option>`).join('')}
              </select>
            </label>
            <label>Carrera Destinataria
              <select name="carrera_id">
                <option value="">— Todas las carreras —</option>
                ${carreras.map(c => `<option value="${c.id}" ${c.id == n.carrera_id ? 'selected' : ''}>${c.nombre}</option>`).join('')}
              </select>
            </label>
          </div>
          <label>Contenido
            <textarea name="contenido" required rows="4">${n.contenido}</textarea>
          </label>
          <div class="admin-form__row">
            <label class="checkbox-toggle">
              <input type="checkbox" name="destacada" ${n.destacada ? 'checked' : ''}>
              <span class="checkbox-toggle__control"></span>
              <span class="checkbox-toggle__text">Destacar esta novedad</span>
            </label>
            ${materiaField}
          </div>
          <div class="admin-form__row">
            <div class="file-input-wrapper">
              <label for="edit-adjunto-file" class="file-input-label">Adjunto (opcional)</label>
              <label class="file-input-group">
                <input type="file" id="edit-adjunto-file" name="adjunto" class="file-input-field">
                <span class="file-input-text">${n.adjunto ? `📎 ${n.adjunto}` : 'Seleccionar archivo'}</span>
              </label>
              <button type="button" id="remove-edit-adjunto" class="file-remove-btn" ${n.adjunto ? '' : 'hidden'}>${n.adjunto ? 'Quitar adjunto' : 'Sin adjunto'}</button>
            </div>
          </div>
          <button type="submit" class="admin-form__submit">
            <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Guardar cambios
          </button>
        </form>
      `;
      document.getElementById('novedadBackBtn').addEventListener('click', () => {
        document.getElementById('novedadesSearch').dispatchEvent(new Event('input'));
      });

      let removeEditAdjunto = false;
      const editFileInput = document.getElementById('edit-adjunto-file');
      const editFileText = editFileInput?.parentElement.querySelector('.file-input-text');
      const removeEditButton = document.getElementById('remove-edit-adjunto');

      if (editFileInput) {
        editFileInput.addEventListener('change', e => {
          removeEditAdjunto = false;
          if (!editFileText) return;
          if (e.target.files.length > 0) {
            const fileName = e.target.files[0].name;
            const fileSize = (e.target.files[0].size / 1024).toFixed(1);
            editFileText.textContent = `📎 ${fileName} (${fileSize} KB)`;
            if (removeEditButton) removeEditButton.hidden = false;
          } else {
            editFileText.textContent = n.adjunto ? `📎 ${n.adjunto}` : 'Seleccionar archivo';
            if (removeEditButton) removeEditButton.hidden = !n.adjunto;
          }
        });
      }

      if (removeEditButton) {
        removeEditButton.addEventListener('click', () => {
          removeEditAdjunto = true;
          if (editFileInput) editFileInput.value = '';
          if (editFileText) editFileText.textContent = 'Sin adjunto';
          removeEditButton.hidden = true;
        });
      }

      // Maneja el envío del formulario de edición de novedad.
      document.getElementById('editNovedadForm').addEventListener('submit', async e => {
        e.preventDefault();
        const data = new FormData(e.target);
        const editAdjuntoFile = document.getElementById('edit-adjunto-file').files[0];
        
        const datosActualizados = {
          titulo: data.get('titulo'),
          contenido: data.get('contenido'),
          categoria_id: +data.get('categoria_id'),
          carrera_id: data.get('carrera_id') ? +data.get('carrera_id') : null,
          destacada: data.has('destacada') ? 1 : 0,
          materia: data.get('materia')?.trim() || null,
          adjunto: editAdjuntoFile ? editAdjuntoFile.name : removeEditAdjunto ? null : n.adjunto
        };

        try {
          // Llama a la API para actualizar la novedad.
          const resultado = await Novedades.actualizar(n.id, datosActualizados);
          Object.assign(n, resultado);
          const cat = categorias.find(c => c.id == n.categoria_id);
          n.categoria = cat ? cat.nombre : 'Sin categoría';

          auditar('editar', 'novedad', `Editada: ${n.titulo}`);
          showToast('Novedad actualizada', `Los datos de ${n.titulo} fueron guardados.`);
          document.getElementById('novedadesSearch').dispatchEvent(new Event('input'));
        } catch (err) {
          console.error('Error al actualizar novedad:', err);
          showToast('Error', 'No se pudo actualizar la novedad', '#E67E5B');
        }
      });
    }
    // --- Lógica del modal de confirmación de peligro (Danger Modal) ---
    const dangerMsg = document.getElementById('dangerMsg');
    const dangerInput = document.getElementById('dangerInput');
    const dangerConfirm = document.getElementById('dangerConfirm');
    const dangerTitle = document.getElementById('dangerTitle');
    const dangerModal = document.getElementById('dangerModal');
    const dangerCancel = document.getElementById('dangerCancel');
    let dangerHandler = null;
    let dangerExpectedWord = 'CONFIRMAR';
    // Función para mostrar el modal de confirmación de peligro.

    function requestDangerConfirm({ title, msg, btnLabel, onConfirm, confirmWord = 'CONFIRMAR' }) {
      dangerTitle.textContent = title;
      dangerMsg.innerHTML = msg;
      dangerConfirm.textContent = btnLabel || 'Eliminar definitivamente';
      dangerExpectedWord = confirmWord;
      dangerModal.querySelector('.danger-modal__hint').innerHTML = `Para confirmar, escribí <code>${confirmWord}</code>:`;
      dangerInput.placeholder = confirmWord;
      dangerInput.value = '';
      dangerConfirm.classList.remove('is-armed');
      dangerHandler = onConfirm;
      dangerModal.classList.add('is-visible');
      setTimeout(() => dangerInput.focus(), 100);
    }
    // Función para cerrar el modal de confirmación de peligro.
    function closeDangerModal() {
      dangerModal.classList.remove('is-visible');
      dangerHandler = null;
    }
    dangerInput.addEventListener('input', () => {
      if (dangerInput.value.trim().toUpperCase() === dangerExpectedWord) {
        // Habilita el botón de confirmar si el texto coincide.
        dangerConfirm.classList.add('is-armed');
      } else {
        dangerConfirm.classList.remove('is-armed');
      }
    });
    dangerCancel.addEventListener('click', closeDangerModal);
    dangerModal.addEventListener('click', e => { if (e.target === dangerModal) closeDangerModal(); });
    dangerConfirm.addEventListener('click', () => {
      if (!dangerConfirm.classList.contains('is-armed')) return;
      const fn = dangerHandler;
      closeDangerModal();
      if (fn) fn();
    });

    /* ============================================================
       9) Logout (mismo patrón que docente)
       Gestiona el modal de confirmación de cierre de sesión.
       ============================================================ */
    const logoutModal = document.getElementById('logoutModal');
    document.getElementById('logoutBtn').addEventListener('click', () => logoutModal.classList.add('is-open'));
    // Bindea los botones de cancelar y confirmar el cierre de sesión.
    document.getElementById('logoutCancel').addEventListener('click', () => logoutModal.classList.remove('is-open'));
    document.getElementById('logoutConfirm').addEventListener('click', () => {
      logoutModal.classList.remove('is-open');
      performLogout();
    });

    /* (Notificaciones removidas — se implementarán en Fase 2) */

    /* ============================================================
       10) Toast (mensajes flotantes de éxito/error)
       Muestra mensajes temporales al usuario.
       ============================================================ */
    const toast = document.getElementById('toast');
    let toastTimer;
    // Función para mostrar un mensaje "toast".
    function showToast(title, msg, color = '#3DAA6A') {
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastMsg').textContent = msg;
      toast.style.setProperty('--toast-color', color);
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 3500);
    }

    // --- Vista inicial al cargar la página ---
    // Vista inicial al cargar la página
    navigateTo('perfil');

    // --- Lógica de Menús Hamburguesa para Admin (responsive) ---
    // Bindea el botón de toggle del sidebar para pantallas móviles.
      bindResponsiveToggles();

      function bindResponsiveToggles() {
        const sidebarToggle = document.getElementById('sidebarToggle');
        const body = document.body;

        // Overlay para la sidebar si no existe
        // Crea un overlay oscuro que aparece cuando el sidebar está abierto en móvil.
        let overlay = document.querySelector('.sidebar-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'sidebar-overlay';
          body.appendChild(overlay);
        }

        // Maneja el clic en el botón de hamburguesa para abrir/cerrar el sidebar.
        sidebarToggle?.addEventListener('click', () => {
          const isOpen = body.classList.toggle('sidebar--open');
          sidebarToggle.setAttribute('aria-expanded', String(isOpen));
          body.style.overflow = isOpen ? 'hidden' : '';
        });

        // Cierra el sidebar si se hace clic en el overlay.
        overlay.addEventListener('click', () => {
          body.classList.remove('sidebar--open');
          sidebarToggle?.setAttribute('aria-expanded', 'false');
          body.style.overflow = '';
        });
      }

  })();
  </script>

  <!-- Autenticación, logout centralizado y validación de rol -->
  <script src="../js/logout.js"></script>
  <script src="../js/admin-auth.js"></script>
</body>
</html>
